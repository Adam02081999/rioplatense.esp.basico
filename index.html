  {
    "id": 335,
    "es": "Si no llego a tiempo, arranquen sin mí y después me sumo.",
    "en": "If I don't make it on time, start without me and I'll join later.",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 336,
    "es": "Lo bueno es que nos queda cerca a los dos.",
    "en": "The good thing is it's close for both of us.",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 337,
    "es": "Me parece bárbaro, quedamos así entonces.",
    "en": "Sounds great, let's leave it at that then.",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 338,
    "es": "Te confirmo mañana a más tardar.",
    "en": "I'll confirm by tomorrow at the latest.",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 339,
    "es": "¿Te queda muy lejos o te viene de paso?",
    "en": "Is it very far for you or is it on your way?",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 340,
    "es": "Si vamos juntos nos ahorramos el viaje.",
    "en": "If we go together we save ourselves the trip.",
    "note": "",
    "sec": "Planes y coordinación"
  },
  {
    "id": 341,
    "es": "Te explico rápido cómo es la cosa así no te pierdo.",
    "en": "Let me quickly explain how it works so I don't lose you.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 342,
    "es": "¿Me harías un favor enorme si tenés un segundo?",
    "en": "Would you do me a huge favour if you've got a second?",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 343,
    "es": "Necesito que me des una mano con esto porque solo no llego.",
    "en": "I need you to give me a hand with this because I can't manage alone.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 344,
    "es": "Si no te molesta, prefiero que lo hablemos en persona.",
    "en": "If you don't mind, I'd rather we talk about it in person.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 345,
    "es": "Perdón que insista, pero necesito una respuesta antes del viernes.",
    "en": "Sorry to insist, but I need an answer before Friday.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 346,
    "es": "¿Me lo podés explicar de nuevo? No terminé de entender la parte del final.",
    "en": "Can you explain it again? I didn't quite get the last part.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 347,
    "es": "Te lo pido como un favor personal, no como algo de laburo.",
    "en": "I'm asking you as a personal favour, not as a work thing.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 348,
    "es": "Lo que quiero decir es que no me termina de cerrar la idea.",
    "en": "What I mean is the idea doesn't quite add up for me.",
    "note": "no me cierra = it doesn't add up",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 349,
    "es": "Dejame que te cuente el contexto primero y después vemos.",
    "en": "Let me give you the background first and then we'll see.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 350,
    "es": "¿Vos me podrías pasar el contacto de la persona que lo hizo?",
    "en": "Could you pass me the contact of the person who did it?",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 351,
    "es": "Si te resulta complicado, decímelo tranquilo y busco otra vuelta.",
    "en": "If it's awkward for you, just tell me and I'll find another way.",
    "note": "buscar la vuelta = to find a workaround",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 352,
    "es": "No hace falta que lo hagas ahora, cuando puedas está bien.",
    "en": "You don't have to do it now, whenever you can is fine.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 353,
    "es": "Te mando todo por escrito así queda registrado.",
    "en": "I'll send you everything in writing so there's a record.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 354,
    "es": "Quería consultarte una cosa antes de tomar la decisión.",
    "en": "I wanted to run something by you before making the decision.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 355,
    "es": "Lo ideal sería que lo tengamos cerrado esta semana.",
    "en": "Ideally we'd have it wrapped up this week.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 356,
    "es": "Si llegás a necesitar algo, estoy a disposición.",
    "en": "If you happen to need anything, I'm available.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 357,
    "es": "Te agradezco un montón, en serio me sacaste de un apuro.",
    "en": "Thanks a ton, you really got me out of a jam.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 358,
    "es": "No sé si me expliqué bien, cualquier duda preguntame.",
    "en": "I'm not sure I explained it well, ask me if anything's unclear.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 359,
    "es": "Hacelo como vos creas, confío plenamente en tu criterio.",
    "en": "Do it however you see fit, I completely trust your judgement.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 360,
    "es": "Prefiero preguntar y quedar como tonto antes que hacerlo mal.",
    "en": "I'd rather ask and look stupid than do it wrong.",
    "note": "",
    "sec": "Explicando y pidiendo"
  },
  {
    "id": 361,
    "es": "Para mí la clave está en empezar de a poco y ser constante.",
    "en": "For me the key is starting small and being consistent.",
    "note": "de a poco = little by little",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 362,
    "es": "Entiendo tu punto, pero me parece que estás dejando algo afuera.",
    "en": "I get your point, but I think you're leaving something out.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 363,
    "es": "Yo lo veo distinto: creo que el problema viene de más atrás.",
    "en": "I see it differently: I think the problem goes further back.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 364,
    "es": "No es que esté en contra, es que no me convence del todo.",
    "en": "It's not that I'm against it, it's that I'm not fully convinced.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 365,
    "es": "Depende mucho de qué estemos buscando exactamente.",
    "en": "It depends a lot on what exactly we're after.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 366,
    "es": "Si me preguntás a mí, iría por el camino más simple.",
    "en": "If you ask me, I'd go the simpler route.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 367,
    "es": "Es una buena idea, el tema es cómo la llevás a la práctica.",
    "en": "It's a good idea, the thing is how you put it into practice.",
    "note": "el tema es = the thing is",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 368,
    "es": "Hay algo de verdad en lo que decís, pero no lo tomaría como regla.",
    "en": "There's some truth in what you're saying, but I wouldn't take it as a rule.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 369,
    "es": "Me cuesta opinar porque no conozco bien el tema.",
    "en": "It's hard for me to weigh in because I don't know the topic well.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 370,
    "es": "A la larga creo que te va a convenir más esta opción.",
    "en": "In the long run I think this option will suit you better.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 371,
    "es": "Lo que pasa es que nadie te lo dice en la cara.",
    "en": "The thing is nobody tells you to your face.",
    "note": "lo que pasa es que = the thing is",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 372,
    "es": "Honestamente me parece que le estás dando demasiadas vueltas.",
    "en": "Honestly I think you're overthinking it.",
    "note": "dar vueltas = to go round in circles",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 373,
    "es": "Ojo que no todo el mundo lo ve de la misma manera.",
    "en": "Careful, not everyone sees it the same way.",
    "note": "ojo que = watch out, heads up",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 374,
    "es": "Coincido en lo general, aunque difiero en los detalles.",
    "en": "I agree broadly, though I differ on the details.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 375,
    "es": "Habría que ver cómo funciona en la práctica antes de decidir.",
    "en": "We'd have to see how it works in practice before deciding.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 376,
    "es": "Yo prefiero no opinar sobre eso, es un tema delicado.",
    "en": "I'd rather not comment on that, it's a sensitive subject.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 377,
    "es": "Es más complejo de lo que parece a primera vista.",
    "en": "It's more complex than it looks at first glance.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 378,
    "es": "Con el tiempo uno se da cuenta de que no era tan grave.",
    "en": "Over time you realise it wasn't that serious.",
    "note": "uno = impersonal \"you\"",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 379,
    "es": "Mirándolo en perspectiva, valió totalmente la pena.",
    "en": "Looking at it in perspective, it was totally worth it.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 380,
    "es": "Cada uno sabrá lo que le sirve.",
    "en": "Everyone knows what works for them.",
    "note": "",
    "sec": "Opiniones desarrolladas"
  },
  {
    "id": 381,
    "es": "Te tengo que contar lo que me pasó el otro día, no lo vas a creer.",
    "en": "I have to tell you what happened to me the other day, you won't believe it.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 382,
    "es": "Resulta que iba caminando tranquilo y me lo cruzo de casualidad.",
    "en": "So I was walking along and I ran into him by chance.",
    "note": "present tense used for vivid storytelling",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 383,
    "es": "Cuando era chico pasaba los veranos en la casa de mis abuelos.",
    "en": "When I was a kid I spent summers at my grandparents' house.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 384,
    "es": "Hacía años que no lo veía y nos pusimos a hablar como si nada.",
    "en": "I hadn't seen him in years and we started talking like no time had passed.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 385,
    "es": "Nunca me había pasado algo así, me quedé sin palabras.",
    "en": "Something like that had never happened to me, I was speechless.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 386,
    "es": "Al principio no entendía nada, pero después me cayó la ficha.",
    "en": "At first I didn't understand a thing, but then it clicked.",
    "note": "caer la ficha = the penny drops",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 387,
    "es": "Fuimos a parar a un lugar que ni sabíamos que existía.",
    "en": "We ended up at a place we didn't even know existed.",
    "note": "ir a parar = to end up",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 388,
    "es": "Estaba por irme cuando justo apareció y cambió todo el plan.",
    "en": "I was about to leave when he showed up and changed the whole plan.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 389,
    "es": "Terminamos charlando hasta las tres de la mañana sin darnos cuenta.",
    "en": "We ended up chatting until three in the morning without realising.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 390,
    "es": "Si te soy sincero, en ese momento no la pasé nada bien.",
    "en": "To be honest, at the time I didn't enjoy it at all.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 391,
    "es": "Mirando para atrás, me río, pero en el momento fue un garrón.",
    "en": "Looking back I laugh, but at the time it was a nightmare.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 392,
    "es": "Me acuerdo patente de ese día, fue hace como diez años.",
    "en": "I remember that day vividly, it was like ten years ago.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 393,
    "es": "Era la primera vez que viajaba solo y estaba muerto de miedo.",
    "en": "It was the first time I travelled alone and I was scared to death.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 394,
    "es": "De a poco le fui agarrando la mano y terminó saliendo bien.",
    "en": "Little by little I got the hang of it and it ended up going well.",
    "note": "agarrarle la mano = to get the hang of it",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 395,
    "es": "Nos reímos durante semanas de lo que había pasado.",
    "en": "We laughed for weeks about what had happened.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 396,
    "es": "Para hacerla corta, al final no fue nadie.",
    "en": "To cut it short, in the end nobody went.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 397,
    "es": "Todavía me acuerdo de la cara que puso cuando se lo dije.",
    "en": "I still remember the face he made when I told him.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 398,
    "es": "Ese viaje me cambió bastante la cabeza.",
    "en": "That trip really changed how I think.",
    "note": "cambiar la cabeza = to shift your outlook",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 399,
    "es": "Fue una de esas cosas que te marcan para siempre.",
    "en": "It was one of those things that stay with you forever.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 400,
    "es": "Nunca pensé que iba a terminar acá, la verdad.",
    "en": "I never thought I'd end up here, honestly.",
    "note": "",
    "sec": "Anécdotas y pasado"
  },
  {
    "id": 401,
    "es": "Estoy armando un proyecto propio y todavía estoy viendo cómo financiarlo.",
    "en": "I'm putting together my own project and I'm still figuring out how to fund it.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 402,
    "es": "Trabajo por mi cuenta, así que organizo yo mismo los tiempos.",
    "en": "I work for myself, so I manage my own schedule.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 403,
    "es": "Se me juntó todo esta semana y no doy abasto.",
    "en": "Everything piled up this week and I can't keep up.",
    "note": "no dar abasto = to not be able to cope",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 404,
    "es": "Necesito definir prioridades porque así no llego a nada.",
    "en": "I need to set priorities because at this rate I won't get anywhere.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 405,
    "es": "Me gustaría invitarte a grabar un episodio, si te interesa el tema.",
    "en": "I'd like to invite you to record an episode, if the topic interests you.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 406,
    "es": "La idea es charlar una hora, tranquilo, sin guion rígido.",
    "en": "The idea is to chat for an hour, relaxed, without a rigid script.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 407,
    "es": "Te paso las preguntas antes así venís con todo pensado.",
    "en": "I'll send the questions beforehand so you come with it all thought out.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 408,
    "es": "Después lo edito yo, así que podés hablar con total libertad.",
    "en": "I edit it afterwards, so you can speak completely freely.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 409,
    "es": "Si hay algo que preferís que saque, me avisás y lo saco.",
    "en": "If there's something you'd rather I cut, tell me and I'll cut it.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 410,
    "es": "Todavía estoy aprendiendo, voy mejorando con cada episodio.",
    "en": "I'm still learning, I get better with every episode.",
    "note": "ir + gerund = gradual progress",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 411,
    "es": "El tema no es la idea, el tema es sostenerla en el tiempo.",
    "en": "The issue isn't the idea, it's sustaining it over time.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 412,
    "es": "Me conviene enfocarme en una cosa antes de abrir otro frente.",
    "en": "It suits me to focus on one thing before opening another front.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 413,
    "es": "Estamos dentro de los tiempos, pero sin margen para errores.",
    "en": "We're on schedule, but with no margin for errors.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 414,
    "es": "Se nos fue de presupuesto y hay que recortar en algún lado.",
    "en": "We went over budget and we have to cut somewhere.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 415,
    "es": "¿Quién se hace cargo de esa parte? Porque no me queda claro.",
    "en": "Who's taking charge of that part? Because it's not clear to me.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 416,
    "es": "Dividámoslo en etapas así no se nos hace una montaña.",
    "en": "Let's break it into stages so it doesn't become a mountain.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 417,
    "es": "Prefiero entregar algo bien hecho aunque me lleve más tiempo.",
    "en": "I'd rather deliver something well done even if it takes longer.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 418,
    "es": "Lo dejamos cerrado por hoy y seguimos mañana con la cabeza fresca.",
    "en": "Let's close it for today and continue tomorrow with a fresh head.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 419,
    "es": "Estoy contento con cómo quedó, salió mejor de lo que esperaba.",
    "en": "I'm happy with how it turned out, better than I expected.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 420,
    "es": "De esto se aprende más que de cualquier curso.",
    "en": "You learn more from this than from any course.",
    "note": "",
    "sec": "Trabajo y proyectos"
  },
  {
    "id": 421,
    "es": "Pará, pará, volvamos un segundo a lo que dijiste antes.",
    "en": "Hold on, let's go back a second to what you said before.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 422,
    "es": "Eso que contás se conecta con algo que me pasó a mí.",
    "en": "What you're telling me connects with something that happened to me.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 423,
    "es": "Dale, contame más, me quedé con la intriga.",
    "en": "Go on, tell me more, you've left me hanging.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 424,
    "es": "Perdón que te interrumpa, pero quiero preguntarte una cosa.",
    "en": "Sorry to interrupt, but I want to ask you something.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 425,
    "es": "¿Me das un ejemplo concreto? Así lo entiendo mejor.",
    "en": "Can you give me a concrete example? So I understand it better.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 426,
    "es": "No te entendí bien esa parte, ¿la podés desarrollar un poco?",
    "en": "I didn't quite get that part, can you expand on it a bit?",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 427,
    "es": "Ahora que lo decís, tiene bastante sentido.",
    "en": "Now that you mention it, it makes quite a lot of sense.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 428,
    "es": "Justo estaba pensando lo mismo mientras hablabas.",
    "en": "I was just thinking the same thing while you were talking.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 429,
    "es": "Cambiando un poco de tema, ¿cómo venís con lo otro?",
    "en": "Changing the subject a bit, how are you getting on with the other thing?",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 430,
    "es": "Antes de que me olvide, te quería comentar algo.",
    "en": "Before I forget, I wanted to mention something to you.",
    "note": "",
    "sec": "Mantener la conversación"
  },
  {
    "id": 431,
    "es": "Siguiendo con lo que decías, yo agregaría una cosa más.",
    "en": "Following on from what you were saying, I'd add one more thing.",
    "note": "",
    "sec": "Mantener la conversación"

        let displaySentences = [...rawSentences];
        let currentIdx = 0;
        let isAutoplayActive = false;
        let synth = window.speechSynthesis;

        function initVoices() {
            let voices = synth.getVoices();
            if (voices.length > 0) {
                const esVoice = voices.find(v => v.lang === 'es-AR') || voices.find(v => v.lang.startsWith('es'));
                const statusEl = document.getElementById('voiceStatus');
                if (esVoice) {
                    statusEl.innerText = `語音引擎：${esVoice.name} (${esVoice.lang})`;
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                } else {
                    statusEl.innerText = "語音引擎已就緒 (使用系統預設西語)";
                    statusEl.className = "text-xs bg-emerald-700 px-3 py-1 rounded-full font-normal";
                }
            }
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }

        function renderList() {
            const container = document.getElementById('sentenceList');
            container.innerHTML = '';
            
            displaySentences.forEach((item, index) => {
                const card = document.createElement('div');
                card.id = `card-${index}`;
                card.className = `bg-white p-5 rounded-2xl shadow-sm border transition-all ${index === currentIdx ? 'border-sky-500 ring-2 ring-sky-100 bg-sky-50/20' : 'border-slate-100 hover:border-slate-200'}`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="space-y-1.5">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-sky-700 bg-sky-100/80 px-2.5 py-0.5 rounded-full">#${item.id}</span>
                                ${item.sec ? `<span class="text-xs font-medium text-slate-500">${item.sec}</span>` : ''}
                            </div>
                            <h2 class="text-xl font-bold text-slate-900 pt-0.5">${item.es}</h2>
                            <p class="text-slate-600 text-sm font-medium">${item.en}</p>
                            ${item.note ? `<div class="text-xs italic text-amber-800 bg-amber-50/80 border border-amber-200/50 p-2.5 rounded-xl mt-2">💡 註解：${item.note}</div>` : ''}
                        </div>
                        <button onclick="playSingle(${index})" class="bg-sky-600 hover:bg-sky-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm transition shrink-0 flex items-center gap-1">
                            🔊 單句朗讀
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function scrollToCurrent() {
            const el = document.getElementById(`card-${currentIdx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function playSingle(index) {
            unlockAudio();
            isAutoplayActive = false;
            currentIdx = index;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function startAutoplay() {
            unlockAudio();
            isAutoplayActive = true;
            renderList();
            scrollToCurrent();
            playCurrentSentence();
        }

        function unlockAudio() {
            if (synth.paused) synth.resume();
            let u = new SpeechSynthesisUtterance("");
            synth.speak(u);
        }

        function playCurrentSentence() {
            synth.cancel();

            if (currentIdx >= displaySentences.length) return;

            const item = displaySentences[currentIdx];
            document.getElementById('currentPlayingText').innerText = `#${item.id} - ${item.es} (${item.en})`;

            const rate = parseFloat(document.getElementById('rateSelect').value);
            const isRepeatOne = document.getElementById('repeatOneCheck').checked;

            let voices = synth.getVoices();
            let esVoice = voices.find(v => v.lang === 'es-AR') || 
                          voices.find(v => v.lang.startsWith('es-419')) || 
                          voices.find(v => v.lang.startsWith('es')) || null;
            
            let enVoice = voices.find(v => v.lang === 'en-US') || 
                          voices.find(v => v.lang.startsWith('en')) || null;

            // 1. 先朗讀阿根廷西語
            speakText(item.es, 'es-AR', esVoice, rate, () => {
                // 2. 停頓 0.5 秒後朗讀英文譯文
                setTimeout(() => {
                    speakText(item.en, 'en-US', enVoice, rate, () => {
                        if (isRepeatOne) {
                            setTimeout(playCurrentSentence, 800);
                        } else if (isAutoplayActive) {
                            if (currentIdx < displaySentences.length - 1) {
                                currentIdx++;
                                renderList();
                                scrollToCurrent();
                                setTimeout(playCurrentSentence, 1000);
                            } else {
                                isAutoplayActive = false;
                                document.getElementById('currentPlayingText').innerText = "🎉 恭喜！所有句子全部播放完畢！";
                            }
                        }
                    });
                }, 500);
            });
        }

        function speakText(text, langCode, voiceObj, rate, callback) {
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = langCode;
            if (voiceObj) utterance.voice = voiceObj;
            utterance.rate = rate;
            
            utterance.onend = () => { if (callback) callback(); };
            utterance.onerror = (e) => { 
                console.error("TTS Error:", e);
                if (callback) callback(); 
            };

            synth.speak(utterance);
        }

        function pauseAudio() {
            isAutoplayActive = false;
            synth.cancel();
            document.getElementById('currentPlayingText').innerText = "已暫停播放";
        }

        function stopAudio() {
            isAutoplayActive = false;
            currentIdx = 0;
            synth.cancel();
            renderList();
            document.getElementById('currentPlayingText').innerText = "已停止播放";
        }

        function nextSentence() {
            if (currentIdx < displaySentences.length - 1) {
                currentIdx++;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function prevSentence() {
            if (currentIdx > 0) {
                currentIdx--;
                renderList();
                scrollToCurrent();
                playCurrentSentence();
            }
        }

        function filterSentences() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            displaySentences = rawSentences.filter(s => 
                s.es.toLowerCase().includes(q) || 
                s.en.toLowerCase().includes(q) || 
                s.note.toLowerCase().includes(q) ||
                s.sec.toLowerCase().includes(q)
            );
            currentIdx = 0;
            renderList();
        }

        window.onload = () => {
            renderList();
            initVoices();
        };
    </script>
